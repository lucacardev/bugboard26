# Redirige tutto il traffico HTTP semplice a HTTPS.
server {
    listen 80;
    server_name 16-22-36-130.nip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 16-22-36-130.nip.io;

    ssl_certificate /etc/letsencrypt/live/16-22-36-130.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/16-22-36-130.nip.io/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy verso il backend: dal punto di vista del browser, le
    # chiamate API partono dalla STESSA origine della pagina (stesso
    # protocollo, stesso host, stessa porta 443) — niente più CORS da
    # gestire per queste richieste, e i cookie viaggiano senza le
    # complicazioni cross-origin viste con IP diretto su HTTP.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback per il client-side routing di Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|svg|ico|png|jpg|jpeg|gif)$ {
        expires 30d;
        access_log off;
    }
}