server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Fallback per il client-side routing di Angular: qualunque path che non
    # corrisponde a un file statico reale (es. /progetti/1/issues/5) viene
    # servito comunque con index.html, lasciando che sia Angular Router,
    # lato browser, a interpretare l'URL e mostrare il componente corretto.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Asset con hash nel nome file (bundle JS/CSS generati da Angular CLI):
    # cache lunga lato browser, sicura perché ogni build cambia il nome file.
    location ~* \.(?:js|css|woff2?|ttf|svg|ico|png|jpg|jpeg|gif)$ {
        expires 30d;
        access_log off;
    }
}