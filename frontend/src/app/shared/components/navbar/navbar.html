<header class="header">
  <div class="header-titolo">
    <button class="bottone-hamburger" (click)="layout.toggleSidebar()" aria-label="Apri menu">☰</button>
    <a routerLink="/progetti" class="logo-link">
      <img src="logo.png" alt="BugBoard26" class="header-logo">
    </a>
  </div>
  <div class="header-utente">
    <span>{{ auth.currentUser()?.username }}</span>
    <button class="bottone-esci" (click)="auth.logout()">Esci</button>
  </div>
</header>
