<div class="container">
  <mat-card class="card">
    <mat-card-header>
      <mat-card-title>Completa il primo accesso</mat-card-title>
      <mat-card-subtitle>Imposta una nuova password permanente</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      @if (datiMancanti) {
        <p class="error-message">Sessione non valida. Torna al login e riprova.</p>
      } @else {
        @if (messaggioErrore) {
          <mat-error class="error-message">{{ messaggioErrore }}</mat-error>
        }

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nuova password</mat-label>
          <input matInput type="password" [(ngModel)]="nuovaPassword" placeholder="••••••••">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Conferma password</mat-label>
          <input matInput type="password" [(ngModel)]="confermaPassword" placeholder="••••••••" (keydown.enter)="completa()">
        </mat-form-field>

        <button mat-raised-button color="primary" class="full-width" (click)="completa()" [disabled]="inCorso">
          @if (inCorso) { Salvataggio... } @else { Conferma }
        </button>
      }
    </mat-card-content>
  </mat-card>
</div>
