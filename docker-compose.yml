services:
  redis:
    image: redis:7-alpine
    container_name: bugboard26-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    container_name: bugboard26-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: bugboard26
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  redis-data:
  postgres-data: